services:
  stack-a:
    profiles: ["a"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.triton_hf
    image: stack-a
    shm_size: 2g
    ports: ["8000:8000", "8001:8001", "8002:8002"]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  stack-c:
    profiles: ["c"]
    image: ${TRTLLM_IMAGE}
    ipc: host
    ports: ["8000:8000"]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - .:/workspace
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    working_dir: /workspace
    command: >
      trtllm-serve NousResearch/Llama-3.2-1B
      --host 0.0.0.0 --port 8000
      --max_batch_size 32 --max_num_tokens 8192 --max_seq_len 4096
      --extra_llm_api_options engine/trtllm.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gateway:
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    image: gateway
    ports: ["8080:8080"]
    environment:
      - GW_BACKEND__URL=http://stack-c:8000
      - GW_BACKEND__MODEL=NousResearch/Llama-3.2-1B
      - GW_MAX_INFLIGHT=32
      - GW_MAX_QUEUE=64
      - GW_QUEUE_TIMEOUT_S=10
    depends_on: [stack-c]